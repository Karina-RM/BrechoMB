<!DOCTYPE html>
<html lang="pt-BR" class="h-full bg-white dark:bg-gray-900">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Brechó — Admin</title>
<link rel="stylesheet" href="/styles.css" />
</head>
<body class="h-full">

  <div id="login-view" class="flex min-h-screen flex-col items-center justify-center gap-8 px-6">
    <span class="text-2xl font-bold text-pink-600 dark:text-pink-400">Brechó — Admin</span>
    <form id="login-form" class="flex w-full max-w-xs flex-col gap-4">
      <div>
        <label for="admin-password" class="block text-sm/6 font-medium text-gray-900 dark:text-gray-100">Senha de admin</label>
        <input type="password" id="admin-password" required autofocus
          class="mt-2 block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-pink-600 sm:text-sm/6 dark:bg-white/5 dark:text-white dark:outline-white/10" />
      </div>
      <button type="submit" class="rounded-md bg-pink-600 px-3 py-2 text-sm font-semibold text-white shadow-xs hover:bg-pink-500 dark:bg-pink-500 dark:hover:bg-pink-400">Entrar</button>
      <p id="login-error" class="text-sm text-red-600 dark:text-red-400"></p>
    </form>
  </div>

  <div id="panel-view" class="hidden min-h-screen">
    <header class="flex items-center justify-between border-b border-gray-200 px-6 py-4 dark:border-white/10">
      <span class="text-lg font-bold text-pink-600 dark:text-pink-400">Brechó — Admin</span>
      <button type="button" id="logout-btn" class="text-sm font-semibold text-gray-500 hover:text-pink-600 dark:text-gray-400 dark:hover:text-white">Sair</button>
    </header>
    <div class="flex">
      <nav id="table-tabs" class="flex w-56 shrink-0 flex-col gap-1 border-r border-gray-200 p-4 dark:border-white/10"></nav>
      <main class="flex-1 overflow-x-auto p-6">
        <div class="mb-4 flex items-center justify-between">
          <h1 id="table-title" class="text-lg font-semibold text-gray-900 dark:text-white"></h1>
          <button type="button" id="add-row-btn" class="rounded-md bg-pink-600 px-3 py-2 text-sm font-semibold text-white shadow-xs hover:bg-pink-500 dark:bg-pink-500 dark:hover:bg-pink-400">+ Adicionar linha</button>
        </div>
        <div id="alert-slot"></div>
        <div id="new-row-form-slot" class="mb-4"></div>
        <div class="overflow-x-auto">
          <table class="min-w-full divide-y divide-gray-200 dark:divide-white/10">
            <thead>
              <tr id="table-head"></tr>
            </thead>
            <tbody id="table-body" class="divide-y divide-gray-100 dark:divide-white/5"></tbody>
          </table>
        </div>
      </main>
    </div>
  </div>

  <script src="/admin.js"></script>
</body>
</html>
