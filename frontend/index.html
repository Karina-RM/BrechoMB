<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>Brechó</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #faf8f5;
    color: #2b2622;
  }
  .card {
    text-align: center;
  }
  h1 {
    font-weight: 600;
    font-size: 1.75rem;
    margin-bottom: 0.5rem;
  }
  #status {
    font-size: 0.95rem;
    color: #8a8178;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Brechó</h1>
    <div id="status">checking backend…</div>
  </div>
  <script>
    fetch("/api/health")
      .then((r) => r.json())
      .then((data) => {
        document.getElementById("status").textContent =
          "backend status: " + data.status;
      })
      .catch(() => {
        document.getElementById("status").textContent = "backend unreachable";
      });
  </script>
</body>
</html>
